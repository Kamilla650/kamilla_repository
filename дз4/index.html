<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма авторизации</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <form class="login-form" id="loginForm" novalidate>
            <h1>Вход в систему</h1>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="example@mail.ru">
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <div style="position: relative;">
                    <input type="password" id="password" placeholder="Пароль">
                    <span id="togglePassword" style="position: absolute; right: 10px; top: 12px; cursor: pointer; font-size: 20px;">👁️</span>
                </div>
                <div class="password-strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <button type="submit" id="submitBtn">Войти</button>

            <p class="register-link">
                Нет аккаунта? <a href="#" id="registerLink">Зарегистрироваться</a>
            </p>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
