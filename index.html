<!DOCTYPE html>
<html>
<head>
    <title>Небоскрёб переменных</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        button {
            background: gold;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 10px;
        }
        .building {
            background: #333;
            padding: 10px;
            border-radius: 10px;
            max-width: 500px;
        }
        .floor {
            padding: 10px;
            border-bottom: 2px solid gold;
            background: #444;
            color: white;
            margin: 2px;
        }
        .info {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid gold;
        }
    </style>
</head>
<body>
    <h1>🏗 Конструктор небоскрёба</h1>

    <button onclick="startBuilding()">🏗 Начать строительство</button>

    <div id="info" class="info"></div>
    <div id="building"></div>

    <script>
        // Переменные для всего здания
        let buildingName = "";
        let floors = 0;
        let material = "";
        let parking = false;
        let year = 2024;

        function startBuilding() {
            // ===== ЭТАП 1 и 3: Спрашиваем всё у пользователя =====
            buildingName = prompt("Название небоскрёба:", "Башня");
            if (!buildingName) return;

            floors = prompt("Сколько этажей?", "5");
            floors = Number(floors);

            let apartments = prompt("Квартир на этаже?", "4");
            apartments = Number(apartments);

            material = prompt("Материал стен?", "стекло и бетон");

            let parkingAnswer = prompt("Есть парковка? (да/нет)", "да");
            parking = (parkingAnswer.toLowerCase() === "да");

            let fitnessAnswer = prompt("Будет фитнес-центр? (да/нет)", "да");
            let fitness = (fitnessAnswer.toLowerCase() === "да");

            // ===== ЭТАП 2: Объект с материалами =====
            const materials = {
                brick: 5000,
                concrete: 20000,
                glass: 8500,
                apartmentsPerFloor: apartments,
                hasFitness: fitness
            };

            // ===== ЭТАП 4: Показываем информацию =====
            let infoHTML = `
                <h2>🏢 ${buildingName}</h2>
                <p>📅 Год: ${year}</p>
                <p>📐 Этажей: ${floors}</p>
                <p>🏗 Материал: ${material}</p>
                <p>🚗 Парковка: ${parking ? '✅ Есть' : '❌ Нет'}</p>
                <p>💪 Фитнес: ${fitness ? '✅ Есть' : '❌ Нет'}</p>
                <p>🏠 Всего квартир: ${floors * apartments}</p>
                <h3>📦 Материалы:</h3>
                <p>🧱 Кирпич: ${materials.brick} тыс.шт.</p>
                <p>🏗 Бетон: ${materials.concrete} м³</p>
                <p>🪟 Стекло: ${materials.glass} м²</p>
            `;

            // ===== ЭТАП 6: Строим здание =====
            let buildingHTML = "<div class='building'>";

            for (let i = floors; i >= 1; i--) {
                buildingHTML += "<div class='floor'>";
                buildingHTML += "<b>Этаж " + i + "</b> ";

                if (i % 2 === 0) {
                    buildingHTML += "🪟 ОКНА";
                } else {
                    buildingHTML += "🚪 ДВЕРИ";
                }

                // Показываем сколько квартир на этаже
                buildingHTML += " <span style='color: gold;'>(" + apartments + " кв.)</span>";

                buildingHTML += "</div>";
            }

            buildingHTML += "</div>";

            // Показываем всё на странице
            document.getElementById("info").innerHTML = infoHTML;
            document.getElementById("building").
            innerHTML = buildingHTML;
            // ===== ЭТАП 2 и 5: Выводим в консоль =====
            console.log("===== ПРОВЕРКА ТИПОВ =====");
            console.log("buildingName:", buildingName, typeof buildingName);
            console.log("floors:", floors, typeof floors);
            console.log("material:", material, typeof material);
            console.log("parking:", parking, typeof parking);
            console.log("materials:", materials, typeof materials);

            console.log("===== ПРЕОБРАЗОВАНИЯ =====");
            console.log('"5" + 3 =', "5" + 3, "(строка)");
            console.log('"5" - 3 =', "5" - 3, "(число)");
            console.log('"5" * "3" =', "5" * "3", "(число)");
        }
    </script>
</body>
</html>
